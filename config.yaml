name: Traefik
version: "0.1.0-alpha.25"
slug: traefik
description: LAN reverse-proxy add-on for Home Assistant. Bundles Traefik with a custom UI for routes, middlewares, Cloudflare DNS-01 TLS, and the Traefik dashboard.
arch:
  - aarch64    # production target (RPi HAOS)
  - amd64      # dev / x86 hosts
init: false
startup: services
boot: manual
# Prebuilt multi-arch images are published to GHCR by CI; the supervisor pulls
# <image>:<version> for store installs. KEEP THIS COMMENTED for local builds:
# when `image:` is set, the supervisor PULLS the prebuilt image instead of
# building from this Dockerfile, so local-add-on dev iteration needs it off.
image: ghcr.io/uncommon-fix/ha-addon-traefik
# 0.9.0: enabled so backend can POST /core/restart via SUPERVISOR_TOKEN
# (the user clicks "Restart HA Core" in the addon UI banner after the
# bundled reachability integration is first deployed). hassio_api alone
# does NOT cover /core/* endpoints — homeassistant_api is required for that.
homeassistant_api: true
# 0.5.1: enabled so the backend can POST /addons/self/restart via the
# SUPERVISOR_TOKEN env var. Used after a Setup-tab save to apply new
# credentials without forcing the user to click Restart in HA's UI.
# Default role ("default") permits only self-management, not other addons.
hassio_api: true
hassio_role: default
# 0.9.0: /homeassistant RW so cont-init's 99-deploy-integration.sh can
# write /homeassistant/custom_components/traefik/ (bundled reachability
# integration). The `:rw` suffix is REQUIRED -- map entries default to `:ro`,
# and without write access find/cp fail with "Read-only file system".
map:
  - homeassistant_config:rw
  # /config, and the ONLY directory that survives an uninstall. The supervisor
  # deletes /data unconditionally (App.unload -> remove_data(path_data)); the
  # "delete configuration" checkbox in the uninstall dialog governs THIS
  # directory instead, so mirroring state here is what makes that checkbox
  # mean what users expect. App.backup() captures it too, unlike /share.
  - addon_config:rw
# Grace period for the container stop, in seconds (supervisor allows 10-300;
# the default 10 is the whole budget for SIGTERM -> SIGKILL). The state mirror
# runs from the backend's s6 finish script during exactly that window, so this
# buys it room. Traefik's own shutdown is fast; this is headroom, not need.
timeout: 30
ingress: true
ingress_port: 8080
# Phase D wires the sidebar entry to our aiohttp backend's two-tab UI
# (Settings + Traefik dashboard iframe). panel_admin defaults to true per HA
# docs (gates the entry to admin users); explicit `true` for documentation.
panel_icon: mdi:router-network
panel_title: Traefik
panel_admin: true
ports:
  "80/tcp": 80
  "443/tcp": 443
ports_description:
  "80/tcp": "HTTP entryPoint (Traefik) — port-forward from your router here for public routes"
  "443/tcp": "HTTPS entryPoint (Traefik) — port-forward from your router here for public TLS routes"
# No supervisor options: every setting (routes, middlewares, TLS, Cloudflare
# token, entry points, log level) is managed in the add-on's own Web UI and
# stored in /data/*.yml. `schema: false` declares "no user-configurable
# options", so the supervisor shows only the Network section (ports above).
options: {}
schema: false
